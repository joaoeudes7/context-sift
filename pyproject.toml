[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-sift"
version = "1.0.0"
description = "Context compression for LLM prefill — logs, JSON, prose, code. 660K-param ML model, 95% reduction on structured data."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name = "João Eudes"}]
keywords = [
    "llm", "context", "compression", "prefill", "nlp", "multilingual",
    "token-reduction", "log-compression", "json-compression", "code-compression",
    "ast", "ml", "inference", "mlx", "pytorch",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "sentencepiece>=0.2",
    "httpx>=0.27,<1",
    "safetensors>=0.5",
    "torch>=2.5",
]

[project.optional-dependencies]
mlx = ["mlx>=0.30"]
proxy = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.urls]
Homepage = "https://github.com/joaoeudes7/context-sift"
Repository = "https://github.com/joaoeudes7/context-sift"

[project.scripts]
compact-dataset = "context_sift.cli:main"
context-sift = "context_sift.runtime_cli:main"
context-sift-proxy = "context_sift.proxy_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/context_sift"]

[tool.hatch.build.targets.wheel.force-include]
"models/context-sift" = "context_sift/models/context-sift"

[tool.hatch.build.targets.sdist]
include = ["src/context_sift", "models/context-sift"]

[tool.hatch.build.targets.sdist.force-include]
"models/context-sift" = "context_sift/models/context-sift"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
