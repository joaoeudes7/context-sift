[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compact-dataset"
version = "0.1.0"
description = "Tiny multilingual context compactor for faster LLM prefill."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "sentencepiece>=0.2"]

[project.optional-dependencies]
mlx = ["mlx>=0.30"]
portable = ["safetensors>=0.5", "torch>=2.5"]

[project.scripts]
compact-dataset = "compact_dataset.cli:main"
context-sift = "compact_dataset.runtime_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/compact_dataset"]

[tool.hatch.build.targets.wheel.force-include]
"models/context-sift" = "compact_dataset/models/context-sift"
